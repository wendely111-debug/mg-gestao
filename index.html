<html lang="pt-BR">
<head>

<style>
:root{--g:#1B1F26;--g2:#262B34;--g3:#353B46;--y:#FFC21A;--y2:#F29F05;--t:#EEF0F3;--m:#9AA3B2;--ok:#38C172;--warn:#F6993F;--bad:#E3342F;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--g);color:var(--t);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--y2)}
header img{height:34px;width:34px;border-radius:8px}
header h1{font-size:17px;margin:0;letter-spacing:.5px}
header small{display:block;color:var(--m);font-size:11px;font-weight:400;letter-spacing:0}
main{padding:14px 14px 120px;max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#12151A;display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid var(--g3)}
nav button{background:none;border:0;color:var(--m);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;min-width:58px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--y)}
#mic{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:7;width:64px;height:64px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--y),var(--y2));color:var(--g);font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#mic.ouvindo{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,194,26,.7)}100%{box-shadow:0 0 0 22px rgba(255,194,26,0)}}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--y);text-transform:uppercase;letter-spacing:.6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--g2);border-radius:var(--r);padding:12px 14px;border:1px solid var(--g3)}
.card .l{color:var(--m);font-size:12px}
.card .v{font-size:20px;font-weight:700;margin-top:2px}
.card.bad .v{color:#ff7b76}.card.ok .v{color:#6ee7a1}.card.y .v{color:var(--y)}
.item{background:var(--g2);border:1px solid var(--g3);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .nm{font-weight:600}
.item .sub{color:var(--m);font-size:12.5px;margin-top:2px}
.item .val{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--g3);color:var(--t);margin-top:6px}
.tag.ok{background:#1f4d33;color:#8ff0b6}.tag.warn{background:#5a3a12;color:#ffc98a}.tag.bad{background:#5c1a18;color:#ffb1ae}.tag.y{background:#5a4706;color:var(--y)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{text-decoration:none;display:inline-block;text-align:center;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--g3);color:var(--t)}
.btn.y{background:var(--y);color:var(--g)}.btn.ok{background:#25a35a;color:#fff}.btn.wa{background:#1fa855;color:#fff}.btn.bad{background:#b3261e;color:#fff}
.btn.s{padding:7px 10px;font-size:12.5px}
.btn.full{width:100%;margin-top:8px}
.bar{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 4px 0;border-bottom:1px solid var(--g3)}
.bar div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.bar i{flex:1;border-radius:4px 4px 0 0;display:block;min-height:2px}
.bar .r{background:var(--y)}.bar .d{background:#5d6675}
.lbls{display:flex;gap:6px;font-size:10.5px;color:var(--m);padding:4px}.lbls span{flex:1;text-align:center}
.vazio{color:var(--m);text-align:center;padding:24px 8px}
label{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--g3);background:#12151A;color:var(--t);font-size:15px;font-family:inherit}
textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:#12151A;border-radius:10px;padding:3px;gap:3px;margin-top:6px}
.seg button{flex:1;border:0;background:none;color:var(--m);padding:9px;border-radius:8px;font-weight:700}
.seg button.on{background:var(--y);color:var(--g)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--g2);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
#modal .box h2{margin-top:0}
.ouvido{background:#12151A;border-radius:10px;padding:12px;min-height:48px;font-size:16px;margin:8px 0}
.entendi{background:#2b2a1a;border:1px solid #6b5a12;border-radius:10px;padding:12px;margin-top:10px}
.dica{font-size:12.5px;color:var(--m)}
.dica code{color:var(--y);font-family:inherit}
.timeline{border-left:2px solid var(--g3);margin-left:6px;padding-left:12px}
.timeline div{margin-bottom:8px;font-size:13px}.timeline b{color:var(--y);font-weight:600}
#doc{display:none;position:fixed;inset:0;z-index:30;background:#e9ebef;overflow:auto}
#doc.on{display:block}
#doc .acoes{position:sticky;top:0;background:var(--g);padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#papel{background:#fff;color:#111;max-width:800px;margin:14px auto;padding:28px 30px;font:12.5px/1.5 Arial,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.15)}
#papel .cab{border-bottom:4px solid #F5A60A;padding-bottom:8px;margin-bottom:14px}
#papel .cab img{height:56px}
#papel .t{text-align:center;font-weight:700;font-size:16px;margin:10px 0 2px}
#papel .s{text-align:center;font-weight:700;color:#5A6270;margin:0 0 4px}
#papel .h{font-weight:700;margin:16px 0 6px;border-left:5px solid #F5A60A;padding-left:8px}
#papel p{margin:0 0 6px;text-align:justify}
#papel p.ind{padding-left:18px}
#papel table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:11px}
#papel td{border:1px solid #c9ccd2;padding:4px 6px;vertical-align:top}
#papel td.g{background:#1B1F26;color:#FFC21A;font-weight:700}
#papel td.k{background:#FFF4D6;width:38%}
#papel .ass{margin-top:34px;text-align:center}
#papel .pb{page-break-before:always;border-top:1px dashed #ccc;margin-top:20px;padding-top:10px}
#papel .falta{background:#fff3b0}
@media print{
  body>*:not(#doc){display:none!important}
  #doc{position:static;display:block;background:#fff}
  #doc .acoes{display:none}
  #papel{box-shadow:none;margin:0;max-width:none;padding:0}
  #papel .falta{background:none}
}
@media (min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <img src="icone-192.png" alt="">
  <h1>MG GESTÃO<small>Locações · contratos · cobranças · financeiro</small></h1>

<main id="app"></main>
<button id="mic" title="Falar um comando" aria-label="Falar um comando">🎤</button>
<nav id="nav">
  <button data-t="inicio" class="on"><b>🏠</b>Início</button>
  <button data-t="contratos"><b>📄</b>Contratos</button>
  <button data-t="cobrancas"><b>💰</b>Cobranças</button>
  <button data-t="financeiro"><b>📊</b>Financeiro</button>
  <button data-t="mais"><b>⚙️</b>Mais</button>
</nav>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="doc"><div class="acoes" id="docacoes"></div><div id="papel"></div></div>

<script src="contrato.js"></script>
<script>
if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.innerHTML = ''; } }
/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const hoje = () => iso(new Date());
const br = s => s ? s.split('-').reverse().join('/') : '';
const diasEntre = (a,b) => Math.round((pISO(b)-pISO(a))/86400000);
const addMeses = (s,n) => { const d=pISO(s); const dia=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(dia,ult)); return iso(d); };
const R$ = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid = () => Math.random().toString(36).slice(2,9);
const semAcento = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const MESES = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_BR = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesAno = s => { const d=pISO(s); return MESES_BR[d.getMonth()].slice(0,3)+'/'+String(d.getFullYear()).slice(2); };

/* valor por extenso (contrato) */
function extensoInt(n){
  const u=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const c=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = x => { if(x===100) return 'cem'; const p=[]; if(x>=100){p.push(c[Math.floor(x/100)]); x%=100;} if(x>=20){p.push(d[Math.floor(x/10)]); x%=10; if(x) p.push(u[x]);} else if(x) p.push(u[x]); return p.join(' e '); };
  if(n===0) return 'zero';
  const grupos=[]; let x=n; while(x>0){grupos.push(x%1000); x=Math.floor(x/1000);}
  const nomes=[['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  const partes=[];
  for(let i=grupos.length-1;i>=0;i--){ const g=grupos[i]; if(!g) continue;
    let t = (i===1 && g===1) ? 'mil' : ate999(g) + (i ? ' '+nomes[i][g>1?1:0] : '');
    partes.push({t,g,i}); }
  return partes.map((p,k)=> (k>0 && (p.i===0) && (p.g<100 || p.g%100===0) ? 'e ' : '') + p.t).join(' ').replace(/\s+/g,' ').trim();
}
function extensoReais(v){
  v = Math.round(Number(v)*100)/100; const r=Math.floor(v); const c=Math.round((v-r)*100);
  let s=''; if(r){ s = extensoInt(r); s += (r%1000000===0 && r>=1000000 ? ' de' : '') + (r===1?' real':' reais'); }
  if(c){ s += (s?' e ':'') + extensoInt(c) + (c===1?' centavo':' centavos'); }
  return s || 'zero reais';
}
const valorContrato = v => v ? R$(v)+' ('+extensoReais(v)+')' : '';

/* leitura de valores falados: "35 mil", "7 mil e 500", "R$ 1.281,82", "mil e duzentos" */
const NUM_PAL = {um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
function lerValor(txt){
  let t = semAcento(txt).replace(/r\$\s*/g,' ').replace(/reais|real/g,' ');
  // número com milhar e vírgula: 1.281,82 | 35.000 | 3467,69
  t = t.replace(/(\d{1,3}(?:\.\d{3})+)(,\d{1,2})?/g, (m,a,b)=> a.replace(/\./g,'') + (b? '.'+b.slice(1):''));
  t = t.replace(/(\d+),(\d{1,2})\b/g,'$1.$2');
  const tokens = t.split(/[\s\-]+/).filter(Boolean);
  let total=0, atual=0, achou=false, iniciou=false;
  for(let i=0;i<tokens.length;i++){
    const w = tokens[i];
    if(/^\d+(\.\d+)?$/.test(w)){ if(iniciou && atual && !/^e$/.test(tokens[i-1]||'')) { if(achou) break; } atual += parseFloat(w); achou=iniciou=true; continue; }
    if(NUM_PAL[w]!==undefined){ atual += NUM_PAL[w]; achou=iniciou=true; continue; }
    if(w==='mil'){ total += (atual||1)*1000; atual=0; achou=iniciou=true; continue; }
    if(w==='milhao'||w==='milhoes'){ total += (atual||1)*1e6; atual=0; achou=iniciou=true; continue; }
    if(w==='e' && iniciou) continue;
    if(w==='centavos' && iniciou){ continue; }
    if(iniciou) break;
  }
  const v = total+atual; return achou ? Math.round(v*100)/100 : null;
}
function lerData(txt){
  const t = semAcento(txt), h=new Date();
  if(/\bhoje\b/.test(t)) return iso(h);
  if(/\bamanha\b/.test(t)){ h.setDate(h.getDate()+1); return iso(h); }
  if(/\bontem\b/.test(t)){ h.setDate(h.getDate()-1); return iso(h); }
  let m = t.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m){ let y = m[3] ? (m[3].length===2 ? 2000+Number(m[3]) : Number(m[3])) : h.getFullYear(); return iso(new Date(y,Number(m[2])-1,Number(m[1]))); }
  m = t.match(/(?:dia\s+)?(\d{1,2}|primeiro)(?:o|º)?\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)/);
  if(m){ const dia = m[1]==='primeiro'?1:Number(m[1]); const mes=MESES.indexOf(m[2]); let d=new Date(h.getFullYear(),mes,dia); if(d < new Date(h.getFullYear(),h.getMonth(),h.getDate()-60)) d.setFullYear(d.getFullYear()+1); return iso(d); }
  m = t.match(/\bdia\s+(\d{1,2}|primeiro)\b/);
  if(m){ const dia = m[1]==='primeiro'?1:Number(m[1]); let d=new Date(h.getFullYear(),h.getMonth(),dia); if(d<new Date(h.getFullYear(),h.getMonth(),h.getDate())) d.setMonth(d.getMonth()+1); return iso(d); }
  return null;
}

/* ===================== dados ===================== */
const CHAVE='mg_gestao_v1';
function limparDados(d){
  const ID = /^[A-Za-z0-9_-]{1,40}$/, ROBO = /^https:\/\/script\.google(usercontent)?\.com\/macros\//;
  if(!d || typeof d!=='object' || !Array.isArray(d.lanc) || !Array.isArray(d.clientes)) throw new Error('estrutura');
  for(const k of ['clientes','maquinas','contratos','lanc','hist']){ d[k] = (Array.isArray(d[k])?d[k]:[]).filter(x=>x && typeof x==='object' && !Array.isArray(x)); }
  for(const k of ['clientes','maquinas','contratos','lanc','hist']) for(const x of d[k]) for(const f of ['id','clienteId','maquinaId','contratoId','lancId'])
    if(x[f]!=null && x[f]!=='' && !ID.test(String(x[f]))) throw new Error('identificador inválido em '+k);
  for(const l of d.lanc){ l.valor=Number(l.valor)||0; l.venc=String(l.venc||''); l.pag=(Array.isArray(l.pag)?l.pag:[]).filter(p=>p&&typeof p==='object').map(p=>({data:String(p.data||''),valor:Number(p.valor)||0,obs:p.obs})); }
  if(!d.empresa || typeof d.empresa!=='object') d.empresa = semente().empresa;
  if(!d.enviados || typeof d.enviados!=='object' || Array.isArray(d.enviados)) d.enviados = {};
  if(d.auto){ const t = /^[A-Za-z0-9_-]{8,80}$/.test(d.auto.token||'') ? d.auto.token : undefined;
    d.auto = (typeof d.auto.url==='string' && ROBO.test(d.auto.url)) ? {url:d.auto.url, token:t} : {token:t}; }
  return d;
}
let S;
try { const bruto = localStorage.getItem(CHAVE); S = bruto ? limparDados(JSON.parse(bruto)) : semente(); }
catch(e){ localStorage.setItem(CHAVE+'_quarentena', localStorage.getItem(CHAVE)||''); S = semente(); setTimeout(()=>alert('Os dados salvos estavam corrompidos e foram isolados. Restaure o último backup em Mais.'),500); }
const salvar = () => { localStorage.setItem(CHAVE, JSON.stringify(S)); agendarSync(); };
function semente(){
  return {
    versao:1,
    empresa:{nome:'MG Locações Ltda',cnpj:'20.441.510/0001-01',rep:'',repCpf:'',whats:'',banco:'',multa:10,juros:1,advogado:'Wendley Steffan Ferreira dos Santos, OAB/PB 27.884'},
    maquinas:[{id:'m1',nome:'Escavadeira Hyundai Robex R220LC-9S B',apelidos:'escavadeira robex hyundai 220 rompedor',serie:'',acessorios:'Caçamba (concha) e rompedor hidráulico com ponteira AJCE 250F',valorRep:0,obs:''},{"id": "m2", "nome": "Motoniveladora (marca e modelo a confirmar)", "apelidos": "motoniveladora patrol niveladora", "serie": "", "acessorios": "", "valorRep": 0, "obs": ""},{"id": "m3", "nome": "Cavalo mecânico nº 1 (marca e modelo a confirmar)", "apelidos": "cavalo caminhao cavalo um", "serie": "", "acessorios": "", "valorRep": 0, "obs": ""},{"id": "m4", "nome": "Cavalo mecânico nº 2 (marca e modelo a confirmar)", "apelidos": "cavalo caminhao cavalo dois", "serie": "", "acessorios": "", "valorRep": 0, "obs": ""},{"id": "m5", "nome": "Carreta prancha para transporte de máquinas", "apelidos": "carreta prancha transporte", "serie": "", "acessorios": "", "valorRep": 0, "obs": ""}],
    clientes:[], contratos:[], lanc:[], hist:[]
  };
}
const cli = id => S.clientes.find(c=>c.id===id) || {nome:'(sem cliente)'};
const maq = id => S.maquinas.find(m=>m.id===id) || {nome:'(sem máquina)'};
const pago = l => l.pag.reduce((a,p)=>a+p.valor,0);
const saldo = l => Math.max(0, Math.round((l.valor - pago(l))*100)/100);
const atraso = l => diasEntre(l.venc, hoje());
function encargos(l){
  const d = atraso(l), s = saldo(l);
  if(d<=0 || !s || l.semContrato) return {multa:0,juros:0,total:s};
  const multa = s*(S.empresa.multa/100), juros = s*(S.empresa.juros/100)*(d/30);
  return {multa, juros, total: s+multa+juros};
}
/* régua de cobrança */
function etapa(l){
  const d = atraso(l);
  if(saldo(l)<=0) return {k:'pago',t:'Pago',c:'ok'};
  if(d < -3) return {k:'emdia',t:'A vencer',c:''};
  if(d < 0) return {k:'lembrete',t:'Lembrete: vence em '+(-d)+' d',c:'y'};
  if(d === 0) return {k:'hoje',t:'Vence hoje',c:'y'};
  if(d < 5) return {k:'atraso',t:d+' d de atraso',c:'warn'};
  if(d < 15) return {k:'suspensao',t:d+' d: aviso de suspensão',c:'warn'};
  if(d < 30) return {k:'retomada',t:d+' d: retomada da máquina',c:'bad'};
  return {k:'juridico',t:d+' d: encaminhar ao jurídico',c:'bad'};
}
function mensagem(l, k){
  const c = cli(l.clienteId), e = encargos(l);
  const base = `${l.desc}, vencimento ${br(l.venc)}, valor ${R$(saldo(l))}`;
  const conta = `Pagamento: ${S.empresa.banco}.`;
  const M = {
    lembrete:`Olá! Aqui é da MG Locações. Passando para lembrar do vencimento: ${base}. ${conta} Obrigado!`,
    hoje:`Bom dia! Hoje vence: ${base}. ${conta} Assim que pagar, por favor envie o comprovante. Obrigado!`,
    emdia:`Olá! Segue a fatura: ${base}. ${conta}`,
    atraso:`Olá. Não identificamos o pagamento de ${base}. Pedimos a regularização hoje e o envio do comprovante. ${conta}`,
    suspensao:`Prezados, o pagamento de ${base} está em atraso há ${atraso(l)} dias. Conforme o contrato, se não houver pagamento em 48 horas, a operação do equipamento será suspensa, com o aluguel correndo normalmente. Valor atualizado: ${R$(e.total)}. ${conta}`,
    retomada:`Prezados, o débito de ${base} está em atraso há ${atraso(l)} dias. Conforme o contrato, comunicamos a resolução da locação e a retirada do equipamento em 24 horas, sem prejuízo da cobrança de ${R$(e.total)}, multa e despesas. Pedimos franquear o acesso ao canteiro.`,
    juridico:`Prezados, o débito de ${base} está em atraso há ${atraso(l)} dias e foi encaminhado à assessoria jurídica da MG Locações para protesto e cobrança judicial. Para evitar essas medidas, entre em contato hoje.`,
    pago:`Recebemos o pagamento de ${l.desc}. Obrigado!`
  };
  return M[k||etapa(l).k];
}
const fone = f => { const d=String(f||'').replace(/\D/g,''); return d ? (d.length<=11 ? '55'+d : d) : ''; };
const linkWa = (f,txt) => 'https://wa.me/'+fone(f)+'?text='+encodeURIComponent(txt);

/* ===================== modal e formulários ===================== */
function abrir(html){ $('#mbox').innerHTML = html; $('#modal').classList.add('on'); }
function fechar(){ $('#modal').classList.remove('on'); paraVoz(); }
$('#modal').onclick = e => { if(e.target.id==='modal') fechar(); };
function campo(id,rot,val='',tipo='text',extra=''){
  if(tipo==='area') return `<label>${rot}</label><textarea id="f_${id}" ${extra}>${esc(val)}</textarea>`;
  return `<label>${rot}</label><input id="f_${id}" type="${tipo}" value="${esc(val)}" ${extra}>`;
}
const fv = id => { const el=$('#f_'+id); return el ? el.value.trim() : ''; };
const num = s => { const v = lerValor(s); return v==null ? 0 : v; };

function formPagamento(id, valorSug){
  const l = S.lanc.find(x=>x.id===id);
  abrir(`<h2>Registrar recebimento</h2><div class="sub">${esc(cli(l.clienteId).nome)} · ${esc(l.desc)} · saldo ${R$(saldo(l))}</div>
  ${campo('valor','Valor recebido (R$)', String(valorSug ?? saldo(l)).replace('.',','),'text','inputmode="decimal"')}
  ${campo('data','Data',hoje(),'date')}
  <button class="btn ok full" onclick="salvarPagamento('${id}')">Confirmar</button><button class="btn full" onclick="fechar()">Cancelar</button>`);
}
function salvarPagamento(id){
  const l=S.lanc.find(x=>x.id===id); const v=num(fv('valor')); if(!v) return alert('Informe o valor.');
  l.pag.push({data:fv('data')||hoje(),valor:v}); S.hist.push({id:uid(),clienteId:l.clienteId,data:hoje(),txt:`Recebido ${R$(v)} referente a ${l.desc}.`});
  salvar(); fechar(); render(); avisar('Recebimento registrado ✅');
}
function pagarCliente(clienteId, valor, data){
  let resto = valor; const abertos = S.lanc.filter(l=>l.tipo==='R' && l.clienteId===clienteId && saldo(l)>0).sort((a,b)=>a.venc<b.venc?-1:1);
  const usados=[];
  for(const l of abertos){ if(resto<=0) break; const p=Math.min(resto,saldo(l)); l.pag.push({data:data||hoje(),valor:Math.round(p*100)/100}); resto-=p; usados.push(l.desc); }
  if(resto>0.009){ S.lanc.push({id:uid(),tipo:'R',clienteId,contratoId:'',maquinaId:'',desc:'Recebimento avulso',ref:hoje(),valor:Math.round(resto*100)/100,venc:data||hoje(),pag:[{data:data||hoje(),valor:Math.round(resto*100)/100}]}); usados.push('avulso'); }
  S.hist.push({id:uid(),clienteId,data:hoje(),txt:`Recebido ${R$(valor)} (${usados.join('; ')}).`});
  salvar();
}
function formLanc(tipo){
  abrir(`<h2>${tipo==='D'?'Nova despesa':'Nova conta a receber'}</h2>
  ${campo('desc','Descrição', tipo==='D'?'':'')}
  ${campo('valor','Valor (R$)','','text','inputmode="decimal"')}
  ${campo('venc',tipo==='D'?'Data':'Vencimento',hoje(),'date')}
  <label>Máquina</label><select id="f_maq"><option value="">(nenhuma)</option>${S.maquinas.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}</select>
  ${tipo==='R'?`<label>Cliente</label><select id="f_cli">${S.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>`:''}
  <button class="btn y full" onclick="salvarLanc('${tipo}')">Salvar</button><button class="btn full" onclick="fechar()">Cancelar</button>`);
}
function salvarLanc(tipo){
  const v=num(fv('valor')); if(!v||!fv('desc')) return alert('Preencha descrição e valor.');
  S.lanc.push({id:uid(),tipo,clienteId:tipo==='R'?fv('cli'):'',contratoId:'',maquinaId:fv('maq'),desc:fv('desc'),ref:fv('venc'),valor:v,venc:fv('venc'),pag:[]});
  salvar(); fechar(); render(); avisar('Lançamento salvo ✅');
}
function apagarLanc(id){ if(confirm('Excluir este lançamento?')){ S.lanc=S.lanc.filter(l=>l.id!==id); salvar(); render(); } }
function formCliente(id){
  const c = S.clientes.find(x=>x.id===id) || {};

  salvar(); fechar(); render(); return c;

function textoContrato(k){
  let t = CONTRATO;
  t = t.replace(/\[op\]\n([\s\S]*?)\[\/op\]\n?/g, k.operador ? '$1' : '');
  t = t.replace(/\[sop\]\n([\s\S]*?)\[\/sop\]\n?/g, k.operador ? '' : '$1');
  return t;
}
function htmlContrato(k, paraWord){
  const v = k.campos;
  const ph = id => v[id] ? esc(v[id]) : `<span class="falta">____________________</span>`;
  const neg = s => s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  let html = paraWord ? '<p style="font-weight:bold;font-size:14pt">MG LOCAÇÕES LTDA</p>' : '<div class="cab"><img src="logo.png" alt="MG Locações"></div>';
  for(const linha of textoContrato(k).split('\n')){
    if(!linha.trim()) continue;
    const L = linha.replace(/\{\{(\w+)\}\}/g,(m,id)=>'\u0000'+id+'\u0001');
    const fill = s => neg(esc(s)).replace(/\u0000(\w+)\u0001/g,(m,id)=>ph(id));
    if(L.startsWith('#T ')) html += `<div class="t">${fill(L.slice(3))}</div>`;
    else if(L.startsWith('#S ')) html += `<div class="s">${fill(L.slice(3))}</div>`;
    else if(L.startsWith('#H ')) html += `<div class="h">${fill(L.slice(3))}</div>`;
    else if(L.trim()==='#P') html += `<div class="pb"></div>`;
    else if(L.trim()==='#Q'){
      let g=null; html += '<p><b>QUADRO-RESUMO</b></p><table>';
      for(const c of CAMPOS){ if(!k.operador && (c.id==='diaria_operador'||c.id==='jornada')) continue;
        if(c.grupo!==g){ g=c.grupo; html += `<tr><td colspan="2" class="g">${esc(g.toUpperCase())}</td></tr>`; }
        html += `<tr><td class="k">${esc(c.rot)}</td><td>${ph(c.id)}</td></tr>`; }
      html += '</table>';
    }
    else if(L.trim()==='#A'){
      for(const [papel,nome] of [['LOCADORA','MG LOCAÇÕES LTDA'],['LOCATÁRIA',v.cli_razao||''],['FIADOR E DEVEDOR SOLIDÁRIO',v.fia_nome||''],['CÔNJUGE DO FIADOR (anuência à fiança)','']])
        html += `<div class="ass">______________________________________________<br>${esc(nome)}<br>${papel}</div>`;
      html += `<p style="margin-top:24px;font-size:11px">Testemunhas (dispensadas se a assinatura for eletrônica):<br>1. ______________________ CPF ____________ &nbsp; 2. ______________________ CPF ____________</p>`;
    }
    else html += `<p class="${/^[a-z]\) |^\[ \]/.test(L)?'ind':''}">${fill(L)}</p>`;
  }
  return html;
}

function baixarWord(id){
  const k=S.contratos.find(x=>x.id===id);
  const css = `body{font-family:Arial;font-size:11pt}.t{text-align:center;font-weight:bold;font-size:14pt}.s{text-align:center;font-weight:bold;color:#5A6270}.h{font-weight:bold;margin-top:12pt;border-left:4pt solid #F5A60A;padding-left:6pt}p{text-align:justify}td{border:1px solid #999;padding:3pt;font-size:9pt}td.g{background:#1B1F26;color:#FFC21A;font-weight:bold}td.k{background:#FFF4D6}table{border-collapse:collapse;width:100%}.ass{text-align:center;margin-top:30pt}`;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>${css}</style></head><body>${htmlContrato(k,true)}</body></html>`;
  baixar(new Blob(['﻿'+html],{type:'application/msword'}), `Contrato ${k.numero} - ${cli(k.clienteId).nome}.doc`);

function exportarAgenda(lista, contrato, nome){
  const ls = lista || S.lanc.filter(l=>l.tipo==='R' && saldo(l)>0 && atraso(l)<=0);
  if(!ls.length) return alert('Não há vencimentos futuros em aberto.');
  const d = s => s.replace(/-/g,'');
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MG Gestao//PT-BR\r\n';
  if(contrato && contrato.fim) ics += `BEGIN:VEVENT\r\nUID:fim-${contrato.id}@mggestao\r\nDTSTAMP:${d(hoje())}T090000\r\nDTSTART;VALUE=DATE:${d(contrato.fim)}\r\nSUMMARY:Fim do contrato ${contrato.numero}: renovar ou recolher a máquina\r\nBEGIN:VALARM\r\nTRIGGER:-P7D\r\nACTION:DISPLAY\r\nDESCRIPTION:Contrato termina em 7 dias\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  ls.forEach(l=>{ ics += `BEGIN:VEVENT\r\nUID:${l.id}@mggestao\r\nDTSTAMP:${d(hoje())}T090000\r\nDTSTART;VALUE=DATE:${d(l.venc)}\r\nSUMMARY:Cobrar ${cli(l.clienteId).nome.slice(0,40)}: ${R$(saldo(l))}\r\nDESCRIPTION:${l.desc}\r\nBEGIN:VALARM\r\nTRIGGER:-P3D\r\nACTION:DISPLAY\r\nDESCRIPTION:Vence em 3 dias\r\nEND:VALARM\r\nBEGIN:VALARM\r\nTRIGGER:PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:Vence hoje\r\nEND:VALARM\r\nEND:VEVENT\r\n`; });
  ics += 'END:VCALENDAR';
  baixar(new Blob([ics],{type:'text/calendar'}), nome || 'vencimentos-MG.ics');
  avisar('📅 Abra o arquivo baixado e toque em "Adicionar" para marcar na agenda');
}

/* ===================== cobrança automática ===================== */
const ETAPAS_FILA = ['lembrete','hoje','atraso','suspensao'];
function filaHoje(){
  const env = S.enviados || {};
  return S.lanc.filter(l=>{ if(l.tipo!=='R' || saldo(l)<=0) return false; const c=cli(l.clienteId); if(c.auto===false) return false;
    const k=etapa(l).k; return ETAPAS_FILA.includes(k) && !env[l.id+':'+k]; }).sort((a,b)=>a.venc<b.venc?-1:1);
}
function abrirFila(forcar){
  const f = filaHoje();
  if(!f.length){ if(forcar) avisar('Nenhuma cobrança pendente hoje 👏'); return; }
  if(!forcar && localStorage.getItem('mg_fila')===hoje()) return;
  localStorage.setItem('mg_fila', hoje());
  abrir(`<h2>⚡ Cobranças de hoje (${f.length})</h2><div class="dica">O app separou as cobranças da régua de hoje. Toque em WhatsApp: a mensagem já vai pronta, é só enviar.</div>
  ${f.map(l=>{ const c=cli(l.clienteId), e=etapa(l); return `<div class="item" id="fila_${l.id}"><div class="top"><div><div class="nm">${esc(c.nome)}</div><div class="sub">${esc(l.desc)} · vence ${br(l.venc)}</div></div><div class="val">${R$(saldo(l))}</div></div><span class="tag ${e.c}">${e.t}</span>
  <div class="row"><a class="btn wa s" target="_blank" href="${linkWa(c.whats, mensagem(l))}" onclick="marcarEnviado('${l.id}')">WhatsApp</a>${c.emails?`<a class="btn s" href="mailto:${esc(c.emails.replace(/\s/g,''))}?subject=${encodeURIComponent('MG Locações: '+e.t)}&body=${encodeURIComponent(mensagem(l))}" onclick="marcarEnviado('${l.id}')">E-mail</a>`:''}<button class="btn s" onclick="marcarEnviado('${l.id}',true)">Pular</button></div></div>`; }).join('')}
  <button class="btn full" onclick="fechar()">Fechar</button>`);
}
function marcarEnviado(id, pulou){
  const l=S.lanc.find(x=>x.id===id); const k=etapa(l).k; (S.enviados ||= {})[id+':'+k]=hoje();
  if(!pulou) registrarContato(id); else salvar();
  const el=document.getElementById('fila_'+id); if(el) el.style.opacity='.35';
}
let _syncT=null;
function agendarSync(){ if(!S.auto || !S.auto.url) return; clearTimeout(_syncT); _syncT=setTimeout(()=>sincronizar(false),1500); }
function sincronizar(manual){
  const a=S.auto; if(!a || !a.url) return;
  fetch(a.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:a.token,dados:S})})
    .then(()=>{ localStorage.setItem('mg_sync', new Date().toLocaleString('pt-BR')); if(manual){ avisar('Dados enviados ao robô ✅'); render(); } })
    .catch(()=>{ if(manual) alert('Sem internet agora. O app envia de novo na próxima alteração.'); });
}
function formAuto(){
  const a = S.auto || {}; const tok = a.token || ('mg-'+Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''));
  abrir(`<h2>Cobrança automática e agenda</h2>
  <div class="dica">O robô roda grátis na conta Google da MG: cobra por e-mail nas datas da régua (lembrete, vencimento, atraso e aviso de suspensão), marca os vencimentos no Google Agenda e manda um resumo diário. Retomada da máquina e jurídico nunca vão sozinhos: ele só avisa você. Siga o guia "Como ligar a cobrança automática".</div>
  ${campo('url','Endereço do robô (URL do app da Web do Google)',a.url||'','url','placeholder="https://script.google.com/macros/s/.../exec"')}
  ${campo('token','Código de segurança (copie para o robô)',tok,'text','readonly')}
  <div class="row"><button class="btn s" onclick="navigator.clipboard.writeText(fv('token'));avisar('Código copiado')">Copiar código</button>${a.url && /^https:\/\/script\.google(usercontent)?\.com\/macros\//.test(a.url)?`<a class="btn s" target="_blank" rel="noopener noreferrer" href="${esc(a.url)}">Testar robô</a>`:''}</div>
  <button class="btn y full" onclick="salvarAuto()">Salvar e ligar</button>${a.url?'<button class="btn bad full" onclick="S.auto={token:S.auto.token};salvar();fechar();render()">Desligar robô</button>':''}<button class="btn full" onclick="fechar()">Cancelar</button>`);
}
function salvarAuto(){
  const url=fv('url');
  if(url && !/^https:\/\/script\.google(usercontent)?\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) return alert('Cole o endereço que termina em /exec, gerado pelo Google Apps Script.');
  S.auto={url, token:fv('token')}; salvar(); fechar(); render(); if(url){ sincronizar(true); }
}
function pedirNotificacao(){ if(!('Notification' in window)) return alert('Este aparelho não suporta avisos. Use os lembretes na agenda.'); Notification.requestPermission().then(p=>{ if(p==='granted'){ avisar('Avisos ativados'); notificarHoje(true); } }); }
function notificarHoje(forcar){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(!forcar && localStorage.getItem('mg_notif')===hoje()) return;
  const ls = S.lanc.filter(l=>l.tipo==='R' && saldo(l)>0 && atraso(l)>=-3);
  if(!ls.length) return;
  const tot = ls.reduce((a,l)=>a+saldo(l),0);
  try{ new Notification('MG Gestão: cobrar hoje', {body:`${ls.length} cobrança(s), total ${R$(tot)}`, icon:'icone-192.png'}); }catch(e){}
  localStorage.setItem('mg_notif', hoje());
}
function backup(){ baixar(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}), `backup-mg-gestao-${hoje()}.json`); }
function restaurar(f){ if(!f) return; f.text().then(t=>{ try{ const d=limparDados(JSON.parse(t)); S=d; salvar(); render(); avisar('Backup restaurado ✅'); }catch(e){ alert('Arquivo inválido.'); } }); }
function exportarCSV(){
  const linhas=[['tipo','cliente','maquina','descricao','referencia','vencimento','valor','pago','saldo']];
  S.lanc.forEach(l=>linhas.push([l.tipo==='R'?'receber':'despesa',cli(l.clienteId).nome||'',maq(l.maquinaId).nome||'',l.desc,l.ref||'',l.venc,String(l.valor).replace('.',','),String(pago(l)).replace('.',','),String(l.tipo==='R'?saldo(l):0).replace('.',',')]));
  baixar(new Blob(['﻿'+linhas.map(r=>r.map(x=>{ let v=String(x); if(/^[=+\-@\t\r]/.test(v) && !/^-?\d+(,\d+)?$/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }).join(';')).join('\n')],{type:'text/csv'}),`financeiro-mg-${hoje()}.csv`);
}
function avisar(t){ const d=document.createElement('div'); d.textContent=t; d.style.cssText='position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#FFC21A;color:#1B1F26;font-weight:700;padding:10px 16px;border-radius:10px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.4)'; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ===================== voz ===================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, ouvindo=false;
function abrirVoz(){
  abrir(`<h2>🎤 Fale o comando</h2>
  <div class="ouvido" id="ouvido">${SR?'Ouvindo...':'Seu navegador não tem reconhecimento de voz. Digite o comando ou use o microfone do teclado.'}</div>
  <textarea id="f_cmd" placeholder="ou digite: recebi 35 mil da Construtora Alfa"></textarea>
  <div class="row"><button class="btn y" onclick="interpretarTela()">Entender</button>${SR?'<button class="btn" onclick="ouvir()">🎤 Falar de novo</button>':''}<button class="btn" onclick="fechar()">Fechar</button></div>
  <div id="entendi"></div>
  <p class="dica">Exemplos: <code>recebi 7 mil da Construtora Alfa</code> · <code>gastei 1.200 com mangueira da escavadeira</code> · <code>novo contrato para Construtora Alfa, 35 mil por mês, 3 meses, a partir de 1º de dezembro</code> · <code>quanto a Construtora Alfa deve</code></p>`);
  if(SR) ouvir();
}
function ouvir(){
  if(!SR) return; paraVoz();
  rec = new SR(); rec.lang='pt-BR'; rec.interimResults=true; rec.continuous=false;
  let final='';
  rec.onresult = e => { let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) final+=e.results[i][0].transcript; else tmp+=e.results[i][0].transcript; } $('#ouvido').textContent = final+tmp; $('#f_cmd').value = (final+tmp).trim(); };
  rec.onerror = e => { $('#ouvido').textContent = e.error==='not-allowed' ? 'Permita o uso do microfone para este site.' : 'Não entendi. Tente de novo ou digite.'; };
  rec.onend = () => { ouvindo=false; $('#mic').classList.remove('ouvindo'); if(final.trim()) interpretarTela(); };
  rec.start(); ouvindo=true; $('#mic').classList.add('ouvindo'); $('#ouvido').textContent='Ouvindo...';
}
function paraVoz(){ try{ rec && rec.abort(); }catch(e){} ouvindo=false; $('#mic').classList.remove('ouvindo'); }
$('#mic').onclick = abrirVoz;
function falar(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

const PARADAS = new Set(['de','da','do','das','dos','e','ltda','me','eireli','sa','construcoes','construtora','servicos','engenharia','conservacao','viaria','comercio','empresa','para','com','a','o']);
function acharCliente(t){
  let melhor=null, nota=0;
  for(const c of S.clientes){
    const termos = new Set([...semAcento(c.nome).split(/\W+/), ...semAcento(c.apelidos||'').split(/\s+/)].filter(w=>w.length>2 && !PARADAS.has(w)));
    let n=0; termos.forEach(w=>{ if(new RegExp('\\b'+w+'\\b').test(t)) n += w.length; });
    if(n>nota){ nota=n; melhor=c; }
  }
  return melhor;
}
function acharMaquina(t){
  let melhor=null, nota=0;
  for(const m of S.maquinas){ const termos=new Set([...semAcento(m.nome).split(/\W+/),...semAcento(m.apelidos||'').split(/\s+/)].filter(w=>w.length>2)); let n=0; termos.forEach(w=>{ if(t.includes(w)) n+=w.length; }); if(n>nota){nota=n;melhor=m;} }
  return melhor;
}
function interpretar(txt){
  const t = semAcento(txt);
  const c = acharCliente(t), m = acharMaquina(t), v = lerValor(txt), d = lerData(txt);
  if(/novo contrato|fazer (um )?contrato|gerar (um )?contrato|contrato novo|criar (um )?contrato/.test(t)){
    const mm = t.match(/(\d+|um|dois|tres|quatro|cinco|seis|doze)\s+mes/); const pal={um:1,dois:2,tres:3,quatro:4,cinco:5,seis:6,doze:12};
    const meses = mm ? (pal[mm[1]] || Number(mm[1])) : null;
    const vm = (()=>{ const p = t.match(/([\d\.,]+\s*(?:mil)?(?:\s+e\s+[\d\.,]+)?|[a-z]+\s+mil)\s*(?:reais)?\s*(?:por|ao|o)\s*mes/); return p ? lerValor(p[1]) : v; })();
    const nomeNovo = c ? '' : ((txt.match(/(?:para|pra|com) (?:a |o )?([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^,]+?)(?:,|$| \d)/) || [])[1] || '').trim();
    const local = ((txt.match(/(?:na obra|em|no local)\s+(?:de\s+)?([^,]+?)(?:,|$)/i)||[])[1]||'');
    return {acao:'contrato', resumo:`Abrir novo contrato${c?' para '+c.nome:(nomeNovo?' para '+nomeNovo:'')}${m?', '+m.nome:''}${vm?', '+R$(vm)+'/mês':''}${meses?', '+meses+' mês(es)':''}${d?', início '+br(d):''}.`, run:()=>formContrato({clienteId:c?.id, maquinaId:m?.id, valor:vm, meses, inicio:d, nomeNovo, local:''})};
  }
  if(/quanto .*(deve|devendo)|saldo|quanto .*receber|quem (me )?deve/.test(t)){
    const ls = S.lanc.filter(l=>l.tipo==='R' && saldo(l)>0 && (!c || l.clienteId===c.id));
    const tot = ls.reduce((a,l)=>a+saldo(l),0), venc = ls.filter(l=>atraso(l)>0).reduce((a,l)=>a+saldo(l),0);
    const frase = c ? `${c.nome.split(' ')[0]} deve ${R$(tot)}, dos quais ${R$(venc)} já vencidos.` : `Você tem ${R$(tot)} a receber, sendo ${R$(venc)} vencidos.`;
    return {acao:'saldo', resumo:frase, run:()=>{ falar(frase); fechar(); if(c) verCliente(c.id); else ir('cobrancas'); }};
  }
  if(/\b(recebi|recebemos|recebido|caiu|entrou|pagou|pagaram|depositou|depositaram|transferiu|mandou o pix)\b/.test(t)){
    if(!v) return {erro:'Não entendi o valor. Ex.: "recebi 35 mil da Construtora Alfa".'};
    if(!c) return {erro:'Não identifiquei o cliente. Diga o nome como está no cadastro.'};
    return {acao:'receber', resumo:`Registrar recebimento de ${R$(v)} de ${c.nome}${d?' em '+br(d):''}, abatendo das parcelas mais antigas.`, run:()=>{ pagarCliente(c.id, v, d); fechar(); render(); avisar('Recebimento registrado ✅'); falar('Recebimento registrado'); }};
  }
  if(/\b(gastei|paguei|despesa|comprei|gasto|conserto|consertei|manutencao|abasteci|troquei)\b/.test(t)){
    if(!v) return {erro:'Não entendi o valor da despesa.'};
    const desc = (txt.match(/(?:com|de|no|na|em)\s+(.+)$/i)||[])[1] || txt;
    return {acao:'despesa', resumo:`Lançar despesa de ${R$(v)}: "${desc.trim()}"${m?' na '+m.nome:''}${d?', em '+br(d):''}.`, run:()=>{ S.lanc.push({id:uid(),tipo:'D',clienteId:'',contratoId:'',maquinaId:m?.id||'',desc:desc.trim().replace(/^./,x=>x.toUpperCase()),ref:d||hoje(),valor:v,venc:d||hoje(),pag:[]}); salvar(); fechar(); render(); avisar('Despesa lançada ✅'); }};
  }
  if(/\b(cobra|cobrar|cobranca|manda cobranca)\b/.test(t)){
    if(!c) return {erro:'Quem devo cobrar? Diga o nome do cliente.'};
    const l = S.lanc.filter(x=>x.tipo==='R'&&x.clienteId===c.id&&saldo(x)>0).sort((a,b)=>a.venc<b.venc?-1:1)[0];
    if(!l) return {erro:c.nome+' não tem valores em aberto.'};
    return {acao:'cobrar', resumo:`Abrir a mensagem de cobrança para ${c.nome} (${etapa(l).t}).`, run:()=>verMsg(l.id)};
  }
  if(/\b(anota|anotar|registra|registrar|lembrete|lembrar|prometeu)\b/.test(t)){
    if(!c) return {erro:'Anotar para qual cliente? Diga o nome.'};
    const nota = txt.replace(/^\s*(anota(r)?|registra(r)?)( que)?\s*/i,'');
    return {acao:'nota', resumo:`Anotar no histórico de ${c.nome}: "${nota}"`, run:()=>{ anotar(c.id, nota); fechar(); }};
  }
  if(/novo cliente|cadastra(r)? (o |um )?cliente/.test(t)){
    const nome = txt.replace(/.*cliente\s*/i,'');
    return {acao:'cliente', resumo:`Cadastrar cliente "${nome}".`, run:()=>{ formCliente(); setTimeout(()=>{ $('#f_nome').value=nome; },50); }};
  }
  return {erro:'Não entendi o comando. Tente começar com: recebi, gastei, novo contrato, quanto deve, cobrar ou anota.'};
}
function interpretarTela(){
  const txt = $('#f_cmd').value.trim(); if(!txt) return;
  const r = interpretar(txt); window._acao = r;
  $('#entendi').innerHTML = r.erro ? `<div class="entendi">🤔 ${esc(r.erro)}</div>` : `<div class="entendi"><b>Entendi:</b> ${esc(r.resumo)}<div class="row"><button class="btn y" onclick="window._acao.run()">✔ Confirmar</button><button class="btn" onclick="$('#entendi').innerHTML=''">Corrigir</button></div></div>`;
}

/* ===================== início ===================== */
if(!localStorage.getItem(CHAVE)) salvar();
render(); notificarHoje(); setTimeout(()=>abrirFila(false), 600); sincronizar(false);
window.addEventListener('online', ()=>sincronizar(false));
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
